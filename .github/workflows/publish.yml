# sell-con/releases - Release Publisher
# ebay-patrol-pro の Actions が repository_dispatch を送信
# → このワークフローが:
#   1. ebay-patrol-pro からアーティファクトをDL (PAT使用)
#   2. GITHUB_TOKEN でリリース作成 + アップロード
#   → 表示は「github-actions[bot]」

name: Publish Release

on:
  repository_dispatch:
    types: [create-release]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release safety
        run: node --test scripts/release-safety.test.cjs
      - name: Reject published release replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: node scripts/release-safety.cjs preflight "$RELEASE_TAG"
      - name: Download artifacts from source repo
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$SOURCE_REPO" == "yamatokondo0707-coder/ebay-patrol-pro" ]] || exit 1

          echo "Source: ${SOURCE_REPO}, Run: ${RUN_ID}, Tag: ${TAG}"
          mkdir -p artifacts

          # アーティファクト一覧を取得
          ARTIFACTS=$(gh api "repos/${SOURCE_REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | "\(.id) \(.name)"')

          echo "Found artifacts:"
          echo "$ARTIFACTS"

          # 各アーティファクトをDL
          while IFS=' ' read -r AID ANAME; do
            [ -z "$AID" ] && continue
            echo "Downloading: ${ANAME} (${AID})..."
            gh api "repos/${SOURCE_REPO}/actions/artifacts/${AID}/zip" > "/tmp/${ANAME}.zip"
            mkdir -p "artifacts/${ANAME}"
            unzip -o "/tmp/${ANAME}.zip" -d "artifacts/${ANAME}"
            rm "/tmp/${ANAME}.zip"
          done <<< "$ARTIFACTS"

          echo "=== Downloaded files ==="
          find artifacts -type f | sort

      - name: Create release (as github-actions[bot])
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # タグが無ければ作成
          gh api repos/${{ github.repository }}/git/refs \
            -X POST \
            -f ref="refs/tags/${TAG}" \
            -f sha="$(gh api repos/${{ github.repository }}/git/ref/heads/main -q '.object.sha')" \
            2>/dev/null || true

          # Keep the previous draft until all replacement assets are uploaded.
          node scripts/release-safety.cjs preflight "$TAG"

          shopt -s nullglob
          files=(artifacts/mac-builds/*.dmg artifacts/win-builds/*.exe)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "Expected exactly three release assets; no draft was changed."
            exit 1
          fi

          # リリースノート作成
          BODY="## Sell Con ${TAG}

          ### Downloads
          - **Windows**: \`Sell Con Setup *.exe\` をダウンロードして実行
          - **Mac (Apple Silicon)**: \`*-arm64.dmg\` をダウンロード
          - **Mac (Intel)**: \`*.dmg\`（arm64表記なし）をダウンロード

          ### インストール方法
          **Windows**: exe を実行 → 「次へ」→ インストール完了
          **Mac**: DMG を開く → Sell Con を Applications にドラッグ → \`xattr -cr /Applications/Sell\\ Con.app\` を実行 → 起動"

          # リリース作成（GITHUB_TOKEN = github-actions[bot]）
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            -X POST \
            -f tag_name="${TAG}" \
            -f name="Sell Con ${TAG}" \
            -f body="${BODY}" \
            -F draft=true \
            -q '.id')
          echo "Release created: ${RELEASE_ID}"

          # ファイルアップロード
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            echo "Uploading: ${fname}..."
            gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=$(printf '%s' "${fname}" | jq -sRr @uri)" \
              -X POST \
              -H "Content-Type: application/octet-stream" \
              --input "$file" > /dev/null
            echo "✅ ${fname}"
          done

          node scripts/release-safety.cjs cleanup "$TAG" "$RELEASE_ID"
          echo "Release ${TAG} is a draft awaiting verification and manual publication."
